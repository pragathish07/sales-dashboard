services:
  db:
    build: ./db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sales_dashboard
    depends_on:
      - db

  client:
    build: ./client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "9090:9090"
    depends_on:
      - server
      - client

volumes:
  pgdata:
