services:
  db:
    build: ./db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  client:
    build: ./client
    restart: always
    expose:
      - "3000"
    depends_on:
      - server

  server:
    build: ./server
    restart: always
    expose:
      - "8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:9090"
    depends_on:
      - server
      - client

volumes:
  pgdata:
